<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fdfbf7" />
  <title>Classic15 — The Autobiography of Benjamin Franklin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --paper:#fdfbf7; --ink:#253044; --muted:#68707d; --line:#e6e1d8; --accent:#a05c34; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); transition:background .25s,color .25s; }
    body[data-theme="sepia"] { --paper:#f4ecd8; --ink:#4d3828; --muted:#806a56; --line:#ddcdb2; --accent:#9a5b36; }
    body[data-theme="dark"] { --paper:#121212; --ink:#d1d5db; --muted:#9ca3af; --line:#303030; --accent:#d99a67; }
    .reader { font-family: Georgia, 'Times New Roman', serif; font-size: var(--reader-size, 19px); line-height: var(--reader-leading, 1.8); }
    .reader.sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .reader p { margin:0 0 1.35em; text-wrap:pretty; }
    .reader h2 { font-size:1.45em; line-height:1.25; letter-spacing:-.02em; margin:3.1rem 0 1.2rem; }
    .reader h3 { font-size:1em; font-weight:normal; font-style:italic; color:var(--muted); margin:2.2rem 0 1.1rem; }
    .progress { transform-origin:left; transform:scaleX(0); }
    header { transform:translateY(0); transition:transform .25s ease, opacity .25s ease; }
    header.hidden-header { transform:translateY(-105%); opacity:0; }
    .control { border:1px solid var(--line); background:color-mix(in srgb, var(--paper) 88%, var(--ink)); color:var(--ink); }
    .control:hover, .control.active { border-color:var(--accent); color:var(--accent); }
    .bottom-bar { background:color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter:blur(12px); border-top:1px solid var(--line); }
    .quiz-card { border:1px solid var(--line); background:color-mix(in srgb,var(--paper) 92%,var(--accent)); }
    @media (max-width:640px) { .reader { font-size:var(--reader-size-mobile, 18px); } }
  </style>
</head>
<body data-theme="light">
  <div id="progressLine" class="progress fixed left-0 right-0 top-0 z-50 h-1 bg-[var(--accent)]"></div>
  <header id="topbar" class="fixed left-0 right-0 top-0 z-40 border-b border-[var(--line)] bg-[color-mix(in_srgb,var(--paper)_92%,transparent)] backdrop-blur-md">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-5 py-4">
      <button id="homeBtn" class="text-left" aria-label="Return to book beginning">
        <div class="text-xs font-semibold uppercase tracking-[.2em] text-[var(--accent)]">Classic15</div>
        <div class="hidden text-sm text-[var(--muted)] sm:block">The Autobiography of Benjamin Franklin</div>
      </button>
      <div class="flex items-center gap-2">
        <div class="relative">
          <button id="fontBtn" class="control rounded-full px-3 py-2 text-xs" data-action="font" aria-expanded="false">A<span class="text-lg">A</span></button>
          <div id="fontPanel" class="absolute right-0 top-12 hidden w-64 rounded-xl border border-[var(--line)] bg-[var(--paper)] p-4 shadow-xl">
            <div class="mb-3 flex items-center justify-between text-xs font-semibold"><span>Text size</span><output id="fontValue">19px</output></div>
            <input id="fontSlider" class="w-full accent-[var(--accent)]" type="range" min="14" max="34" step="1" value="19" aria-label="Text size" />
            <div class="mt-2 flex justify-between text-[10px] text-[var(--muted)]"><span>Small</span><span>Large</span></div>
          </div>
        </div>
        <button class="control rounded-full px-3 py-2 text-xs" data-action="theme">Theme</button>
        <button class="control hidden rounded-full px-3 py-2 text-xs sm:block" data-action="fullscreen">Fullscreen</button>
        <button id="settingsBtn" class="control rounded-full px-3 py-2 text-xs" aria-label="Open reading settings">⚙</button>
      </div>
    </div>
    <div id="settings" class="hidden border-t border-[var(--line)] px-5 py-3">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-4 text-sm">
        <span class="font-semibold">Type</span>
        <button class="control rounded px-2 py-1" data-font="serif">Serif</button>
        <button class="control rounded px-2 py-1" data-font="sans">Sans</button>
        <span class="ml-0 font-semibold sm:ml-3">Spacing</span>
        <button class="control rounded px-2 py-1" data-leading="1.65">Compact</button>
        <button class="control rounded px-2 py-1" data-leading="1.8">Relaxed</button>
        <span id="savedLabel" class="ml-auto text-xs text-[var(--muted)]">Saved locally</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 pb-36 pt-32 sm:px-10">
    <div class="mb-12 text-center">
      <p class="mb-4 text-xs font-semibold uppercase tracking-[.25em] text-[var(--accent)]">A daily reading practice</p>
      <h1 class="text-4xl font-semibold tracking-tight sm:text-5xl">The Autobiography of<br class="hidden sm:block" /> Benjamin Franklin</h1>
      <p class="mt-5 text-sm text-[var(--muted)]">Volume I of The Harvard Classics · 15-minute edition</p>
    </div>
    <article id="book" class="reader"></article>
  </main>

  <div class="bottom-bar fixed bottom-0 left-0 right-0 z-30 px-5 py-3 text-sm">
    <div class="mx-auto flex max-w-3xl items-center gap-4">
      <div class="min-w-0 flex-1">
        <div class="mb-1 flex justify-between gap-3 text-xs font-semibold">
          <span id="sectionLabel" class="truncate">Day 1</span>
          <span id="progressLabel">0%</span>
        </div>
        <div class="h-1.5 overflow-hidden rounded-full bg-[var(--line)]"><div id="bar" class="h-full rounded-full bg-[var(--accent)] transition-[width] duration-150" style="width:0%"></div></div>
      </div>
      <div id="timeLabel" class="hidden whitespace-nowrap text-xs text-[var(--muted)] sm:block">15 min left</div>
      <button id="completeBtn" class="control rounded-full px-3 py-2 text-xs whitespace-nowrap">Mark day done</button>
    </div>
  </div>

  <script>
    let sections=[]; let loading=false;
    const KEY='classic15-state-v1';
    const state=Object.assign({theme:'light',size:19,leading:1.8,font:'serif',scroll:0,section:0,done:[]}, JSON.parse(localStorage.getItem(KEY)||'{}'));
    const $=s=>document.querySelector(s), book=$('#book');
    async function loadManifest(){ const data=await fetch('content/manifest.json').then(r=>r.json()); sections=data.sections; await loadSection(state.section); update(); }
    async function loadSection(index){ if(loading||!sections[index]||document.querySelector(`[data-day="${index}"]`))return; loading=true; const s=sections[index]; const data=await fetch('content/'+s.url).then(r=>r.json()); const quiz=data.quiz.map((q,qi)=>`<fieldset class="mb-6" data-question="${qi}"><legend class="mb-2 font-semibold">${qi+1}. ${q.question}</legend>${q.options.map((o,oi)=>`<label class="mb-2 block cursor-pointer rounded border border-[var(--line)] p-2 text-sm hover:border-[var(--accent)]"><input class="mr-2" type="radio" name="q-${index}-${qi}" value="${oi}">${String.fromCharCode(65+oi)}. ${o}</label>`).join('')}</fieldset>`).join(''); const el=document.createElement('section'); el.id='day-'+s.day; el.dataset.day=index; el.innerHTML=`<h2>Day ${s.day}: ${s.title}</h2>${data.paragraphs.map(p=>`<p>${p}</p>`).join('')}<div class="quiz-card mb-10 rounded-2xl p-5"><h3 class="!mt-0 !mb-2 !not-italic !font-semibold">Day ${s.day} reading check</h3><p class="text-sm text-[var(--muted)]">Answer 4 of 5 correctly to earn your badge.</p><form data-quiz="${index}">${quiz}<button class="control rounded-full px-4 py-2 text-sm" type="submit">Check answers</button><p class="mt-3 text-sm" data-quiz-result></p></form></div><button class="next control mb-12 rounded-full px-4 py-2 text-sm" data-next="${index+1}">${sections[index+1]?'Load next reading':'You reached the end'}</button>`; book.appendChild(el); loading=false; update(); }
    function save(){ state.scroll=scrollY; localStorage.setItem(KEY,JSON.stringify(state)); }
    function apply(){ document.body.dataset.theme=state.theme; document.documentElement.style.setProperty('--reader-size',state.size+'px'); document.documentElement.style.setProperty('--reader-size-mobile',state.size+'px'); document.documentElement.style.setProperty('--reader-leading',state.leading); book.classList.toggle('sans',state.font==='sans'); $('#fontSlider').value=state.size; $('#fontValue').textContent=state.size+'px'; }
    function update(){ const max=document.documentElement.scrollHeight-innerHeight; const pct=max?Math.min(100,Math.max(0,scrollY/max*100)):0; $('.progress').style.transform=`scaleX(${pct/100})`; $('#bar').style.width=pct+'%'; $('#progressLabel').textContent=Math.round(pct)+'%'; const visible=[...book.querySelectorAll('section')].reduce((a,e)=>e.getBoundingClientRect().top<innerHeight*.4?e:a,null); if(visible){state.section=+visible.dataset.day; const s=sections[state.section]; $('#sectionLabel').textContent=`Day ${s.day}: ${s.title}`;} $('#timeLabel').textContent=Math.max(0,Math.ceil(15*(1-pct/100)))+' min left'; }
    function theme(){ state.theme=state.theme==='light'?'sepia':state.theme==='sepia'?'dark':'light'; apply(); save(); }
    document.addEventListener('click',e=>{ const a=e.target.closest('[data-action]'); if(a){if(a.dataset.action==='theme')theme(); if(a.dataset.action==='font'){const panel=$('#fontPanel'); const open=panel.classList.toggle('hidden'); $('#fontBtn').setAttribute('aria-expanded',String(!open));} if(a.dataset.action==='fullscreen')document.documentElement.requestFullscreen?.();} if(!e.target.closest('#fontPanel, #fontBtn')){$('#fontPanel').classList.add('hidden');$('#fontBtn').setAttribute('aria-expanded','false');} const f=e.target.closest('[data-font]'); if(f){state.font=f.dataset.font;apply();save();} const l=e.target.closest('[data-leading]'); if(l){state.leading=l.dataset.leading;apply();save();} const next=e.target.closest('[data-next]'); if(next){loadSection(+next.dataset.next);next.remove();} });
    document.addEventListener('submit',e=>{ const form=e.target.closest('[data-quiz]'); if(!form)return; e.preventDefault(); const index=+form.dataset.quiz; fetch('content/'+sections[index].url).then(r=>r.json()).then(data=>{let score=0; data.quiz.forEach((q,i)=>{if(form.querySelector(`input[name="q-${index}-${i}"]:checked`)?.value==q.answer)score++;}); const result=form.querySelector('[data-quiz-result]'); if(score>=4){if(!state.badges)state.badges=[]; if(!state.badges.includes(index))state.badges.push(index); state.done=[...new Set([...(state.done||[]),index])]; save(); result.textContent=`Badge earned! ${score}/5 correct 🏅`; result.style.color='var(--accent)';}else result.textContent=`${score}/5 correct. Review the reading and try again.`;}); });
    $('#fontSlider').addEventListener('input',e=>{state.size=+e.target.value;apply();save();});
    $('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden'); $('#homeBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'}); $('#completeBtn').onclick=()=>{if(!state.done.includes(state.section))state.done.push(state.section);save();$('#completeBtn').textContent='Day completed ✓';};
    let lastY=scrollY; addEventListener('scroll',()=>{ update(); save(); if(scrollY>lastY+8 && scrollY>120)$('#topbar').classList.add('hidden-header'); if(scrollY<lastY-8)$('#topbar').classList.remove('hidden-header'); lastY=scrollY;},{passive:true});
    addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return; if(e.key==='t'||e.key==='T')theme(); if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen?.(); if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();scrollBy({top:innerHeight*.82,behavior:'smooth'});} if(e.key==='ArrowLeft'){e.preventDefault();scrollBy({top:-innerHeight*.82,behavior:'smooth'});}});
    apply(); addEventListener('load',()=>{loadManifest().then(()=>scrollTo(0,state.scroll));}); update();
  </script>
</body>
</html>

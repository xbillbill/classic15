<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic15 Library</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#fdfbf7;color:#253044;font-family:Georgia,serif}.card{background:#fffdfa;border:1px solid #e6e1d8;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #51412b18}</style></head>
<body><main class="mx-auto max-w-6xl px-6 py-12 sm:px-10"><div class="mb-14 flex items-end justify-between gap-6"><div><p class="mb-4 text-xs font-bold uppercase tracking-[.25em] text-[#a05c34]">Classic15</p><h1 class="text-5xl font-semibold tracking-tight">A library for a life of reading.</h1><p class="mt-5 max-w-xl text-lg text-slate-500">Fifteen minutes at a time, with a short reflection at the end of every reading.</p></div><a class="text-sm text-[#a05c34]" href="index.html?book=franklin">Continue reading →</a></div><div id="library" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div></main><script>fetch('content/books.json').then(r=>r.json()).then(books=>{library.innerHTML=books.map(b=>`<a class="card overflow-hidden rounded-2xl p-6" href="index.html?book=${b.id}"><div class="mb-12 h-2 rounded-full" style="background:${b.color}"></div><p class="text-xs uppercase tracking-[.18em] text-slate-400">Volume ${b.volume}</p><h2 class="mt-2 text-2xl font-semibold">${b.title}</h2><p class="mt-2 text-sm italic text-slate-500">${b.author}</p><p class="mt-6 text-sm leading-6 text-slate-600">${b.description}</p><p class="mt-8 text-sm font-semibold text-[#a05c34]">Read now →</p></a>`).join('')})</script></body></html>
